<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Musicify</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<!-- Custom Titlebar -->
<div class="titlebar" id="titlebar">
  <div class="titlebar-left">
    <svg class="titlebar-logo" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="12" fill="#1DB954"/>
      <path d="M7 15.5C9.5 14 13 13.5 16.5 14.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M6 11.5C9.5 9.5 14.5 9 18 10.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M5 7.5C9 5 15.5 4.5 20 6.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span class="titlebar-title">Musicify</span>
  </div>
  <div class="titlebar-drag"></div>
  <div class="titlebar-controls">
    <button class="tb-btn" id="tb-min" title="Minimize">&#8722;</button>
    <button class="tb-btn" id="tb-max" title="Maximize">&#9633;</button>
    <button class="tb-btn tb-close" id="tb-close" title="Close">&#10005;</button>
  </div>
</div>

<div id="app">
  <!-- Left Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <nav class="main-nav">
        <a href="#" class="nav-item active" data-page="home" title="Home">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Home</span>
        </a>
        <a href="#" class="nav-item" data-page="search" title="Search">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <span>Search</span>
        </a>
      </nav>
    </div>

    <div class="library-section">
      <div class="library-header">
        <span class="library-title">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
          Your Library
        </span>
        <button class="icon-btn" id="add-playlist-btn" title="Create Playlist">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
      </div>

      <div class="library-filter">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="playlists">Playlists</button>
        <button class="filter-chip" data-filter="liked">Liked</button>
      </div>

      <div class="playlists-list" id="playlists-list">
        <!-- Playlists rendered here -->
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="main-content">
    <!-- Dynamic content rendered by JS -->
  </main>

  <!-- Right Queue Panel -->
  <aside class="queue-panel" id="queue-panel">
    <div class="queue-header">
      <h3>Queue</h3>
      <button class="icon-btn" id="close-queue-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="queue-section">
      <p class="queue-label">Now Playing</p>
      <div id="queue-now-playing"></div>
    </div>
    <div class="queue-section">
      <p class="queue-label">Next Up</p>
      <div id="queue-next-list"></div>
    </div>
  </aside>
</div>

<!-- Player Bar -->
<div class="player-bar" id="player-bar">
  <!-- Now Playing -->
  <div class="now-playing" id="now-playing">
    <div class="np-thumb-wrap">
      <img id="np-thumb" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23282828'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%23404040'/%3E%3C/svg%3E" alt="" />
    </div>
    <div class="np-info">
      <div class="np-title" id="np-title">Select a song to play</div>
      <div class="np-artist" id="np-artist">—</div>
    </div>
    <button class="icon-btn like-btn" id="like-btn" title="Like">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </button>
  </div>

  <!-- Controls -->
  <div class="player-controls">
    <div class="controls-row">
      <button class="ctrl-btn" id="shuffle-btn" title="Shuffle">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="ctrl-btn" id="prev-btn" title="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn play-pause-btn" id="play-btn" title="Play">
        <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="ctrl-btn" id="next-btn" title="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button class="ctrl-btn" id="repeat-btn" title="Repeat">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>
    <div class="progress-row">
      <span class="time-label" id="current-time">0:00</span>
      <div class="progress-container" id="progress-container">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
          <div class="progress-thumb" id="progress-thumb"></div>
        </div>
      </div>
      <span class="time-label" id="total-time">0:00</span>
    </div>
  </div>

  <!-- Right Controls -->
  <div class="player-right">
    <button class="ctrl-btn sm" id="queue-toggle-btn" title="Queue">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
    </button>
    <button class="ctrl-btn sm" id="mute-btn" title="Mute">
      <svg id="vol-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <svg id="mute-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
    </button>
    <div class="volume-wrap">
      <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="80" />
    </div>
    <button class="ctrl-btn sm" id="theme-btn" title="Toggle Theme">
      <svg id="moon-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
      <svg id="sun-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 11H1v2h3v-2zm9-9h-2v2.99h2V2zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 11v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/></svg>
    </button>
  </div>
</div>

<!-- Mobile Bottom Navigation Bar (Spotify Mobile style) -->
<nav class="mobile-bottom-nav" id="mobile-bottom-nav">
  <button class="mob-nav-btn active" data-page="home">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span>Home</span>
  </button>
  <button class="mob-nav-btn" data-page="search">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 14z"/></svg>
    <span>Search</span>
  </button>
  <button class="mob-nav-btn" data-page="liked">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    <span>Library</span>
  </button>
</nav>

<!-- Floating Mini Video / Audio Player -->
<div id="mini-player-wrap" class="mini-player-wrap">
  <div class="mini-player-header">
    <span id="mini-player-title">Now Playing</span>
    <button id="toggle-mini-player-btn" title="Minimize / Expand">🗕</button>
  </div>
  <iframe
    id="yt-iframe"
    src="about:blank"
    allow="autoplay; encrypted-media; picture-in-picture"
    allowfullscreen>
  </iframe>
</div>

<!-- Create Playlist Modal -->
<div class="modal-overlay" id="modal-overlay" style="display:none">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modal-title">Create Playlist</h3>
      <button class="icon-btn" id="modal-close">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="text" id="playlist-name-input" class="modal-input" placeholder="Playlist name" maxlength="60" />
      <input type="text" id="playlist-desc-input" class="modal-input" placeholder="Add an optional description" maxlength="200" />
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn-primary" id="modal-confirm">Create</button>
    </div>
  </div>
</div>

<!-- Context Menu -->
<div class="context-menu" id="context-menu" style="display:none">
  <ul id="context-menu-list"></ul>
</div>

<!-- Toast Notification -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
